name: Elementary
version: "3.0.0"
main: dev.elementary.ElementaryPlugin
api-version: "1.21"
description: Elemental shards - eight elements; aqudr always spawns with Ice.
commands:
  info:
    description: Show your shard, tier, challenge progress and cooldowns.
    usage: /info [toggle]
  elementary:
    description: Admin utilities.
    usage: /elementary <set|reload> ...
    permission: elementary.admin
  broker:
    description: Change any player's shard to a chosen element.
    usage: /broker <player> <shard>
    permission: elementary.admin
  trust:
    description: Treat a player as an ally - your abilities spare them, your support includes them.
    usage: /trust [player]
  untrust:
    description: Remove a player from your ally list.
    usage: /untrust <player>
  ability1:
    description: Cast your first ability (same as right-click).
    usage: /ability1
  ability2:
    description: Cast your second ability (same as sneak + left-click).
    usage: /ability2
  ultimate:
    description: Cast your ultimate (same as sneak + right-click, Tier 2 only).
    usage: /ultimate
    aliases: [ult]
permissions:
  elementary.admin:
    default: op
