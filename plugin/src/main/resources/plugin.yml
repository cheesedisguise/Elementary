name: Elementary
version: "0.1.0"
main: dev.elementary.ElementaryPlugin
api-version: "1.21"
description: Elemental shards - eight elements; aqudr always spawns with Ice.
commands:
  info:
    description: Show your shard, tier, challenge progress and cooldowns.
    usage: /info [toggle]
  elementary:
    description: Admin utilities.
    usage: /elementary <set|reload> ...
    permission: elementary.admin
  broker:
    description: Change any player's shard to a chosen element.
    usage: /broker <player> <shard>
    permission: elementary.admin
permissions:
  elementary.admin:
    default: op
