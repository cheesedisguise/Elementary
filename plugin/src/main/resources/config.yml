# Elementary configuration.

# Players locked to a specific element. Keys are player UUIDs (never
# names - names change). These players skip the random roll on every
# assignment path and always receive their bound element; Shard Traders
# refuse them. Resolve the UUID once (e.g. https://mcuuid.net) and
# paste it here.
#
# aqudr -> ICE. Replace the placeholder below with aqudr's real UUID.
bound-players:
  "00000000-0000-0000-0000-000000000000": ICE

# Ability messages are always caster-only; this just turns the default
# on or off for new players (each player can /info toggle).
ability-messages-default: true

# Mirage clone rendering. "players" (default) shows real fake players
# wearing the caster's actual skin, built from the server's own packet
# classes - no extra plugin needed. "stands" falls back to armour-stand
# mannequins.
mirage-clones: players

# Ability HUD style. "font" (default) draws the ability icons above the
# hotbar with the remaining cooldown floating on top of each icon for
# players who accepted the server resource pack, and shows the boss bar
# to everyone else. "font-force" sends glyphs to all players,
# "bossbar" uses only the bar, "off" disables the HUD.
hud-style: font
